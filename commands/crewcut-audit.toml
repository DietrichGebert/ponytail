description = "Quality audit of the whole repo: bugs, security, load, tests, speed, bloat"
prompt = "Audit the whole repository (or the folder the user names) like the senior developer who just inherited it. Map first: README, deploy and build config, dependencies, entry points, tests; find the expected load (one person or many users and processes); trace the main flows and read fully the paths with user input, money, auth, data writes, background jobs and shared state. Look for, in this order: bugs, risk (security holes, data loss), scale (races, the same work done by every process, memory that only grows, a query per item, O(n^2)), risky logic without a test, slow code (big = problem, small = suggestion), lean (dead code, duplicate helpers, stdlib or native instead of custom code or a dependency, factories with one product and pass-through wrappers (an interface a test must replace is not yagni), near-copies to merge (including test methods that differ only in data: one parameterized test), a function doing several unrelated jobs to split, never split by line count), structure (static classes doing I/O or holding state, services created instead of injected, a dependency a test must replace with no interface, inheritance where composition fits, more than 4 method parameters where an object or interface should be passed, a constructor injecting more than 4 services, the same switch on a type or mode in several places or a method with more than 3 branches with real logic where classes behind an interface fit, nesting deeper than 3 levels). Before calling code unused, grep the whole tree including tests, fixtures, config and string references. Every finding needs a concrete case. A shortcut marked with a shortcut: (or older crewcut:) comment that names its limit is a decision, not a finding. Propose the smallest fix, prefer deleting code, never add layers. Very simple English. Start with 'What this repo does:' and the load you assumed. Then at most 20 numbered findings grouped Must fix / Should fix / Nice to have, most important first; each: a bold title with file:lines, then four bullets: What this is, Problem, Fix, If we skip it. End with 'Verdict:', 'Lean: -N lines, -M dependencies possible.' and 'Not checked:' for the parts you did not read. Change no code."
