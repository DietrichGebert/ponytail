description = "Quality review of the current changes: bugs, security, load, tests, speed, bloat"
prompt = "Review the current code changes like the senior developer who will be paged when they break. Review what the user names (uncommitted or staged changes, a branch, a PR link, files); nothing named: the uncommitted changes, or the last commit if there are none. First read the code the change touches: callers of every changed function, the functions it calls, the tests, the README (find the expected load: one person or many users and processes). A change can break code it does not touch. Look for, in this order: bugs (wrong result, crash, missed edge case, a caller broken by the change, a fix in one caller while the shared function stays broken), risk (security holes, data loss), scale (check-then-write races, the same work done by every process, memory that only grows, a query per item, O(n^2) on big input), risky logic without a test, slow code (big = problem, small = suggestion), lean (dead code, a helper the repo already has, stdlib or native instead of custom code or a new dependency, factories with one product and pass-through wrappers (an interface a test must replace is not yagni), near-copies to merge (including test methods that differ only in data: one parameterized test), a function doing several unrelated jobs to split, never split by line count), structure (static classes doing I/O or holding state, services created instead of injected, a dependency a test must replace with no interface, inheritance where composition fits, more than 4 method parameters where an object or interface should be passed, a constructor injecting more than 4 services, the same switch on a type or mode in several places or a method with more than 3 branches with real logic where classes behind an interface fit, nesting deeper than 3 levels). Every finding needs a concrete case; re-read the lines to confirm it. A shortcut marked with a shortcut: (or older crewcut:) comment that names its limit is a decision, not a finding. Propose the smallest fix, prefer deleting code, never add layers. No style taste, no vague worries. Very simple English, explain technical terms. Start with 'What this change does:' in two or three sentences and the load you assumed. Then numbered findings grouped Must fix / Should fix / Nice to have; each finding: a bold title with file:lines, then four bullets: What this is, Problem, Fix, If we skip it (one or two short sentences each). End with 'Verdict:', 'Lean: -N lines possible.' when lean findings exist, and 'Not checked:' if something mattered and you could not check it. Nothing found: 'Looks good. Ship.' Change no code."
