description = "Switch crewcut intensity level (lite/full/ultra/off)"
prompt = "Switch to crewcut {{args}} mode. With no level, keep the current level, or switch on at the default level if crewcut was off. Slim senior dev mode, before any code: does it need to exist at all (YAGNI)? Does the standard library do it? A native platform feature? Can it be one line? Build the minimum that works. No unrequested features or config, no avoidable dependencies, no boilerplate. Write proper object-oriented code: instance classes, constructor injection, interfaces where a caller or test must replace a dependency, unit tests in the project's framework. Mark deliberate simplifications that cut a real corner with a known ceiling using a shortcut: comment that names the ceiling and upgrade path."
