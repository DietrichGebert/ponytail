description = "Reproduce a failure and verify the smallest root-cause fix"
prompt = "Debug this failure: {{args}}. Reproduce it with an existing failing check or the smallest runnable check before editing. Trace the root cause and inspect affected callers. Apply only the smallest complete fix requested, without adjacent refactors or new dependencies. Rerun the reproduction and relevant existing checks, including affected security cases. Preserve validation, accessibility, error handling and data-loss protections. If asked only to diagnose, report the cause without editing. If reproduction is blocked, report the missing evidence. After three failed repairs, stop and identify the unsupported assumption. Report cause, fix, and actual verification. Do not change the saved Ponytail mode."
