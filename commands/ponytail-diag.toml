description = "Structured debugging: flow traces, truth tables, hypothesis, to-dos"
prompt = "Diagnose a failure with structured reasoning. Build an internal call-flow + truth-table model from code-as-data — do the analysis in reasoning, emit only the verdict. Default: one line. ROOT CAUSE: <file>:<line> — <cause> | FIX: <direction> | PROBE: <line> <expr>. If asked 'more': add flow trace (branches annotated with actual true/false), truth table (if ≥2 flags combine), data validation table (invariant | expected | actual | verdict), and hypotheses (H<n>: <claim> For:<ev> Against:<ev> Test:<exp> Cost:low|med|high Status:supported|confirmed). Extended methods: fishbone (≥3 subsystems), 5 Whys, waterfall/data-flow, barrier analysis, change analysis, FTA, Pareto, concurrency/interleaving, timing/drift. Cross-skill: debug-root-cause (confidence levels), debug-reduce (shrink repro), debug-reference (normalise before comparing), debug-verify (regression test), debug-fix (handoff — one repro → one patch → one verify). To-do ledger: TODO <file>:<line>: [sev:P0|P1|P2] <issue> | fix: <candidate> | test: <repro>. Stop when hypothesis reaches confirmed and handoff is ready. Does not apply fixes."
