description = "Quick reference for crewcut levels, skills, and commands"
prompt = "Show the crewcut quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /crewcut lite (build what's asked, name the lazier alternative in one line), /crewcut (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /crewcut ultra (deletion before addition, challenges the requirement before building). Commands: /crewcut-review (over-engineering review of the current changes), /crewcut-audit (whole-repo over-engineering audit), /crewcut-debt (harvest shortcut: comments into a tracked ledger), /crewcut-gain (measured-impact scoreboard from the benchmark), /crewcut-help (this card). Deactivate with 'stop crewcut', 'normal mode', or /crewcut off; resume anytime with /crewcut. Default mode is full; change it with the CREWCUT_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/crewcut/config.json (Windows: %APPDATA%\\crewcut\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
