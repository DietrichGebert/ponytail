description = "Port functions to target platform with feasibility scoring"
prompt = "Map a function to a target architecture/backend with minimal output. Enumerate source functions (grep -rn 'def |func |public '). For each: classify direct/adapt/rethink, score feasibility (perf/correctness/deps) with a debug-hypothesis block, and propose optimised replacement. Default: one line. <fn> → <direct|adapt|rethink> | feas: green|yellow|red | verify: rN | risk: low|med|high | doc: ports/ProjectName-YYYYMMDD-HHMM.md. If chained with 'ponytail-diag' or asked 'more': full branch validation, state-space coverage, dependency waterfall, risk cascade, debug-verify rungs. Reference port ladder (debug-reference): normalise inputs/precision/ordering/seeds/versions/tolerations before mismatch. Verification: r1 static → r2 build → r3 unit → r4 known-good → r5 differential → r6 regression → r7 perf. Only escalate by risk cascade (adapt +1, rethink +2). Studies saved to ports/. Does not blindly transliterate. Research internal alternatives even if they need more code. Optimal performance is the goal."
