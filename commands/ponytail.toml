description = "Switch ponytail intensity level (lite/full/ultra/off)"
prompt = "Switch to ponytail {{args}} mode. With no level, keep the current level, or switch on at the default level if ponytail was off. Lazy senior dev mode, before any code: does it need to exist at all (YAGNI)? Does the standard library do it? A native platform feature? Can it be one line? Build the minimum that works. No unrequested abstractions, no avoidable dependencies, no boilerplate. Mark deliberate simplifications that cut a real corner with a known ceiling using a shortcut: comment that names the ceiling and upgrade path. Use the project's documentation style (JSDoc, TSDoc, Javadoc, docstrings); extend declaration docs only for limits that belong there. Respect project guidance choosing another marker, no marker, or tracker-only records; invent no tags, duplicate no explanation, and keep internal details out of public API docs."
