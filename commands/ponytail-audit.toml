description = "Audit the whole repo for over-engineering, what can be deleted"
prompt = "Audit the entire repository for over-engineering only, not correctness. Scan the whole tree, not a diff. One line per finding, ranked by reduction in concepts and distributed policy, then size of the cut: <tag> <what to cut>. <replacement>. [path]. Tags: delete (dead code/speculative feature), stdlib (reinvented standard library), native (dependency doing what the platform does), yagni (speculative abstraction that contains no necessary policy), shrink (same logic, fewer lines). Preserve behavior and boundaries that contain policy; one implementation alone is not evidence of bloat. Line count is a size estimate, not the objective. End with the net lines and dependencies removable. If nothing to cut: 'Lean already. Ship.'"
