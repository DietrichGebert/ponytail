# Reference template — merge the [[hooks]] block into ~/.kimi-code/config.toml.
# Replace PONYTAIL_DIR with the path to your ponytail checkout.
# A [[hooks]] block accepts only event, matcher, command, and timeout — extra
# keys make the config fail to load.
# Docs: https://www.kimi.com/code/docs/en/kimi-code-cli/customization/hooks.html

# Every user prompt: track /ponytail mode switches and inject the ruleset at
# the active level. Kimi Code appends the hook's stdout to the model context
# on exit 0, which is how the ruleset gets in.
[[hooks]]
event = "UserPromptSubmit"
command = "node PONYTAIL_DIR/hooks/ponytail-mode-tracker.js"
timeout = 5

# Subagent injection is intentionally not configured: in kimi 0.38–0.40.1 a
# PreToolUse hook's stdout is discarded on exit 0, SubagentStart is
# observation-only (stdout ignored), and updatedInput rewrites are not
# honored — no hook channel reaches a sub-agent's context. Should a future
# Kimi Code version append PreToolUse stdout, the block below enables it
# (the subagent-spawning tool is named "Agent"):
#
# [[hooks]]
# event = "PreToolUse"
# matcher = "Agent"
# command = "node PONYTAIL_DIR/hooks/ponytail-subagent.js"
# timeout = 5
