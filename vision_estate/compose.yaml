# Local development database only; never use these sample credentials in production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vision_estates
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vision_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vision -d vision_estates"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vision_db:

